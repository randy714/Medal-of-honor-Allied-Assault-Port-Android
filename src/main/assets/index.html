<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOHAA Launcher 1.3</title>
<style>
:root{--bg:#000;--sf:#0d1a10;--sf2:#14301c;--ln:#1f3a26;--ac:#3fa65a;--tx:#e6efe8;--mu:#7f9a86;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;user-select:none}
header{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;font-weight:800;color:var(--ac)}
header h1{font-size:17px;margin:0}header p{margin:0;font-size:12px;color:var(--mu)}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,var(--sf2),var(--sf) 70%)}
.hero h2{margin:0 0 2px;font-size:20px}.hero p{margin:0 0 14px;color:var(--mu);font-size:13px}
.play{width:100%;padding:15px;border:0;border-radius:10px;background:var(--ac);color:#02140a;font-size:16px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row small{display:block;color:var(--mu);font-size:12px}
h3{margin:4px 2px 8px;font-size:13px;color:var(--ac);font-weight:600}
.seg{display:flex;background:#000;border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px 0;border:0;background:none;color:var(--mu);font-size:13px}
.seg button.on{background:var(--ac);color:#02140a;font-weight:700}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0}
.sw i{position:absolute;inset:0;background:#26372b;border-radius:13px;transition:.15s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#9db3a3;transition:.15s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:23px;background:#02140a}
input[type=range]{width:100%;accent-color:var(--ac)}
.val{color:var(--ac);font-weight:600}
.stack{padding:11px 0;border-bottom:1px solid var(--ln)}.stack:last-child{border:0}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
select,input[type=text]{width:100%;background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px;font-size:14px}
.btn2{padding:10px 14px;background:var(--sf2);border:1px solid var(--ln);border-radius:9px;color:var(--tx);font-size:13px}
.btn2.red{color:#e58a8a}
.acts{display:flex;gap:8px;margin-top:8px}.acts .btn2{flex:1}
.pad{position:relative;width:100%;aspect-ratio:2/1;background:#000;border:1px solid var(--ln);border-radius:10px;overflow:hidden;touch-action:none;background-image:linear-gradient(var(--sf2) 1px,transparent 1px),linear-gradient(90deg,var(--sf2) 1px,transparent 1px);background-size:10% 20%}
.b{position:absolute;border:2px solid var(--ac);background:rgba(63,166,90,.22);color:var(--tx);display:grid;place-items:center;font-size:10px;font-weight:700;transform:translate(-50%,-50%);touch-action:none;text-align:center;line-height:1.1;border-radius:50%}
.b.sq{border-radius:10px}.b.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}.b.act{background:var(--ac);color:#02140a}
.joy .kn{width:42%;height:42%;border-radius:50%;background:rgba(63,166,90,.7);pointer-events:none}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf)}
nav button{flex:1;padding:11px 0 9px;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--sf2);border:1px solid var(--ac);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;text-align:center;max-width:90%}
.hud.s{opacity:1}
#test{position:fixed;inset:0;background:#000;z-index:40;display:none;touch-action:none}
#test.on{display:block}
#tc{position:absolute;inset:0}
#ti{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);color:var(--ac);font-size:13px;text-align:center;pointer-events:none}
#tx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:3}
.ver{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;padding:2px 4px}
