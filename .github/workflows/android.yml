name: Build OpenMoHaa Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest
  
      steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
  
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
  
      - name: Setup Android SDK Manually
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android/sdk/cmdline-tools/latest
          unzip -q cmdtools.zip -d $HOME/android/sdk/cmdline-tools/
          mv $HOME/android/sdk/cmdline-tools/cmdline-tools/* $HOME/android/sdk/cmdline-tools/latest/
          rm -rf $HOME/android/sdk/cmdline-tools/bin $HOME/android/sdk/cmdline-tools/lib
          
          echo "ANDROID_HOME=$HOME/android/sdk" >> $GITHUB_ENV
          echo "$HOME/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/sdk/platform-tools" >> $GITHUB_PATH
  
      - name: Accept Licenses and Install Build Tools
        run: |
          export ANDROID_HOME=$HOME/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
  
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
  
      - name: Build Debug APK
        run: ./gradlew assembleDebug
  
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmohaa-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
