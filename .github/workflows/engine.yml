name: Build OpenMoHAA engine
on:
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bearstonem/openmohaa-vr
          ref: vr-quest3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison
      - name: Disable OpenXR
        run: |
          sed -i 's/set(USE_OPENXR ON CACHE INTERNAL "")/set(USE_OPENXR OFF CACHE INTERNAL "")/' cmake/platforms/android.cmake
          grep -n "USE_OPENXR" cmake/platforms/android.cmake
      - name: Build native libraries
        run: |
          cmake -B build-gl1 -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DUSE_OPENXR=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=OFF \
            -DBUILD_RENDERER_GL1=ON -DBUILD_RENDERER_GL2=OFF -DUSE_GL4ES=ON
          cmake --build build-gl1 -j"$(nproc)"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          validate-wrappers: false
      - name: Package APK
        working-directory: misc/android
        run: gradle assembleDebug -PnativeLibsDir=../../build-gl1/apk-libs
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-engine-APK
          path: misc/android/app/build/outputs/apk/debug/*.apk
